[versions]
junit = "4.13.2"
opentest4j = "1.3.0"
versions = "0.66.0"
# The IDE to build against, test with and launch with `./gradlew runIde`; also the lowest supported version
intellijIdea = "2026.2"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }

[plugins]
versions = { id = "io.github.ben-manes.versions", version.ref = "versions" }
